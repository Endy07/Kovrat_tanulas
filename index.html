<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kovrat tanulás</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{--bg:#EDF0F4;--surface:#FFFFFF;--ink:#17202B;--muted:#586475;--line:#C9D1DC;--accent:#1B5CBA;--led:#F29E0C}
@media (prefers-color-scheme: dark){:root{color-scheme:dark;--bg:#10141A;--surface:#19202A;--ink:#E6EBF1;--muted:#98A4B4;--line:#2E3845;--accent:#72A6F2;--led:#FFB01F}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;font-size:17px;line-height:1.55;padding:32px 16px 64px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
h1{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3rem);margin:0;letter-spacing:-.02em}
.eyebrow{font-family:"JetBrains Mono",Consolas,monospace;font-size:.78rem;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
p{margin:0;max-width:62ch;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:12px}
a.lesson{display:flex;gap:16px;align-items:center;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:16px 18px;color:inherit;text-decoration:none}
a.lesson:hover,a.lesson:focus-visible{border-color:var(--accent);outline:none}
.bits{font-family:"JetBrains Mono",Consolas,monospace;font-weight:500;color:var(--led);font-size:1.1rem}
.lesson b{display:block;font-size:1.15rem}
.lesson span.d{color:var(--muted);font-size:.95rem}
</style>
</head>
<body>
<div class="wrap">
  <span class="eyebrow">9. évfolyam · Mechwart, programozás</span>
  <h1>Kovrat tanulás</h1>
  <p>Interaktív leckék és gyakorlófeladatok az informatikai alapokhoz. Az év során folyamatosan bővül.</p>
  <div class="list">
    <a class="lesson" href="kettes-szamrendszer.html">
      <span class="bits">1101</span>
      <span><b>Kettes számrendszer</b><span class="d">Átváltás tízes és kettes között: diák, lejátszott levezetések, gyakorlófeladatok.</span></span>
    </a>
  </div>
</div>
</body>
</html>
